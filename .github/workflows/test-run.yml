# 真机运行验证：在 Linux / macOS runner 上实际启动桌面端并截屏（手动触发）
name: Run-test DSH Desktop (Linux / macOS)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  linux-run:
    name: Linux run + screenshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps + runtime + build
        working-directory: DSH Desktop
        run: |
          npm install --no-audit --no-fund
          node scripts/fetch-runtime.mjs
          npx electron-builder --linux AppImage --publish never

      - name: Install GUI runtime libs + Xvfb + capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libgtk-3-0 libgbm1 libasound2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libpango-1.0-0 libcairo2 libglib2.0-0 libdbus-1-3 libx11-xcb1 libxtst6 fonts-noto-core || \
          sudo apt-get install -y -qq xvfb imagemagick libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libgtk-3-0 libgbm1 libasound2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libpango-1.0-0 libcairo2 libglib2.0-0 libdbus-1-3 libx11-xcb1 libxtst6 fonts-noto-core

      - name: Launch app under Xvfb and screenshot
        working-directory: DSH Desktop
        run: |
          # AppImage 无 FUSE 环境：解包后直接运行
          ./release/*.AppImage --appimage-extract >/dev/null 2>&1
          APP_BIN=$(find squashfs-root -name "DeepSeek Harness" -type f | head -1)
          echo "app bin: $APP_BIN"
          export ELECTRON_DISABLE_SANDBOX=1
          export DSH_SMOKE_TEST=1
          export DSH_SMOKE_ANY=1
          export DSH_SMOKE_OUT="$PWD/release/linux-smoke-page.png"
          export DSH_DESKTOP_URL="http://127.0.0.1:3090/"
          export DSH_DESKTOP_SERVER_PORT="3090"
          Xvfb :99 -screen 0 1400x900x24 &
          export DISPLAY=:99
          sleep 2
          "$APP_BIN" > linux-app.log 2>&1 &
          APP_PID=$!
          # 等服务起来后截全屏
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -m 2 http://127.0.0.1:3090/; then break; fi
            sleep 2
          done
          sleep 20
          import -window root release/linux-desktop.png
          kill $APP_PID 2>/dev/null || true
          sleep 3
          ls -la release/*.png || true
          tail -5 linux-app.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-run-screenshots
          path: |
            DSH Desktop/release/linux-desktop.png
            DSH Desktop/release/linux-smoke-page.png
            DSH Desktop/linux-app.log
          if-no-files-found: error

  macos-run:
    name: macOS run + screenshot
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps + runtime + build (dir)
        working-directory: DSH Desktop
        run: |
          npm install --no-audit --no-fund
          node scripts/fetch-runtime.mjs
          npx electron-builder --mac dir

      - name: Launch app and screenshot
        working-directory: DSH Desktop
        run: |
          APP_BIN="$PWD/release/mac-arm64/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness"
          ls release/
          echo "app bin: $APP_BIN"
          export DSH_SMOKE_TEST=1
          export DSH_SMOKE_ANY=1
          export DSH_SMOKE_OUT="$PWD/release/mac-smoke-page.png"
          export DSH_DESKTOP_URL="http://127.0.0.1:3090/"
          export DSH_DESKTOP_SERVER_PORT="3090"
          "$APP_BIN" > mac-app.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -m 2 http://127.0.0.1:3090/; then break; fi
            sleep 2
          done
          sleep 20
          screencapture -x release/macos-desktop.png
          kill $APP_PID 2>/dev/null || true
          sleep 3
          ls -la release/*.png || true
          tail -5 mac-app.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-run-screenshots
          path: |
            DSH Desktop/release/macos-desktop.png
            DSH Desktop/release/mac-smoke-page.png
            DSH Desktop/mac-app.log
          if-no-files-found: error
